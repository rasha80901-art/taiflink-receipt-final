<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>سند استلام مبلغ - طيف لينك</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef2f6;font-family:Tahoma,Arial,sans-serif}
.toolbar{
  position:sticky;top:0;z-index:10;display:flex;gap:10px;justify-content:center;align-items:center;
  padding:12px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);flex-wrap:wrap
}
.toolbar button{
  border:0;border-radius:9px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer
}
.print{background:#1769aa;color:#fff}
.clear{background:#e8edf4;color:#24354e}
.hint{font-size:12px;color:#667085}
.stage{padding:18px 8px 30px;display:flex;justify-content:center;overflow:auto}
.paper{
  position:relative;width:min(96vw,794px);aspect-ratio:1055/1491;background:#fff;
  box-shadow:0 12px 32px rgba(0,0,0,.16);overflow:hidden
}
.template{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}

.field{
  position:absolute;border:1px solid transparent;outline:none;background:transparent;
  color:#112a63;font-family:Tahoma,Arial,sans-serif;font-weight:700;text-align:center;
  padding:0 .4%;height:2.8%;line-height:1;direction:rtl
}
.field:focus{border-color:rgba(23,105,170,.6);background:rgba(255,255,255,.22);border-radius:4px}

#name       {left:30.3%;top:37.3%;width:45.0%}
#date       {left:30.2%;top:43.0%;width:45.0%}
#amountText {left:55.2%;top:48.7%;width:20.0%}
#amountNum  {left:22.0%;top:48.7%;width:20.3%;direction:ltr}
#dueDate    {left:21.9%;top:54.4%;width:46.2%}

.check{
  position:absolute;width:2.75%;aspect-ratio:1;border:0;background:transparent;padding:0;
  display:grid;place-items:center;color:#0d2c68;font-weight:700;font-size:clamp(12px,2.2vw,23px);
  cursor:pointer
}
#activeCheck{left:31.4%;top:10.95%}
#inactiveCheck{left:31.4%;top:14.55%}
.check.selected::after{content:"✓";transform:translateY(-4%)}

@media(max-width:650px){
  .stage{padding:8px 2px 20px}
  .paper{width:99vw}
  .hint{width:100%;text-align:center}
}
@media print{
  @page{size:A4 portrait;margin:0!important}

  html,body{
    margin:0!important;
    padding:0!important;
    width:210mm!important;
    height:297mm!important;
    max-height:297mm!important;
    overflow:hidden!important;
    background:#fff!important;
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }

  .toolbar{display:none!important}

  .stage{
    position:fixed!important;
    inset:0!important;
    width:210mm!important;
    height:297mm!important;
    margin:0!important;
    padding:0!important;
    overflow:hidden!important;
    display:block!important;
    background:#fff!important;
  }

  .paper{
    position:absolute!important;
    top:7mm!important;
    left:7mm!important;
    width:196mm!important;
    height:277mm!important;
    margin:0!important;
    box-shadow:none!important;
    overflow:hidden!important;
    break-inside:avoid!important;
    page-break-inside:avoid!important;
    break-after:avoid!important;
    page-break-after:avoid!important;
  }

  .field{
    border:0!important;
    background:transparent!important;
    -webkit-appearance:none!important;
    appearance:none!important;
    opacity:1!important;
    color:#112a63!important;
  }

  body > *:not(.stage){
    display:none!important;
  }
}
</style>
</head>

<script>
const fields=[...document.querySelectorAll('.field')];
const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d');

function fitText(el, printing=false){
  const paper=document.getElementById('paper');
  // Important on iPhone: beforeprint can fire while the page still has the phone width.
  // In print mode we therefore use the A4/base scale directly.
  const scale=printing ? 0.93 : Math.max(0.45, paper.clientWidth/794);
  let size=Number(el.dataset.max||28)*scale;
  const min=Number(el.dataset.min||12)*scale;
  const available=Math.max(10,el.clientWidth-(10*scale));
  const value=el.value||'';
  while(size>min){
    ctx.font=`700 ${size}px Tahoma, Arial, sans-serif`;
    if(ctx.measureText(value).width<=available) break;
    size-=0.5;
  }
  el.style.fontSize=size+'px';
}
function fitAll(printing=false){fields.forEach(el=>fitText(el,printing))}
fields.forEach(el=>{
  el.addEventListener('input',()=>{
    fitText(el);
    localStorage.setItem('taif_new_'+el.id,el.value);
  });
});

const active=document.getElementById('activeCheck');
const inactive=document.getElementById('inactiveCheck');
function setStatus(el){
  const was=el.classList.contains('selected');
  active.classList.remove('selected');
  inactive.classList.remove('selected');
  if(!was) el.classList.add('selected');
  localStorage.setItem('taif_new_status',
    active.classList.contains('selected')?'active':
    inactive.classList.contains('selected')?'inactive':'');
}
active.onclick=()=>setStatus(active);
inactive.onclick=()=>setStatus(inactive);

function clearForm(){
  fields.forEach(el=>{el.value='';localStorage.removeItem('taif_new_'+el.id)});
  active.classList.remove('selected');
  inactive.classList.remove('selected');
  localStorage.removeItem('taif_new_status');
  fitAll();
}
(function restore(){
  fields.forEach(el=>{const v=localStorage.getItem('taif_new_'+el.id); if(v!==null) el.value=v});
  const s=localStorage.getItem('taif_new_status');
  if(s==='active') active.classList.add('selected');
  if(s==='inactive') inactive.classList.add('selected');
  requestAnimationFrame(fitAll);
})();


function safeFilePart(value){
  return (value || '')
    .trim()
    .replace(/[\\/:*?"<>|]+/g,'-')
    .replace(/\s+/g,' ');
}

function printWithFileName(){
  const name = safeFilePart(document.getElementById('name').value) || 'بدون اسم';
  const receiptDate = safeFilePart(document.getElementById('date').value) || 'بدون تاريخ';
  const oldTitle = document.title;
  document.title = `${name}_${receiptDate}`;
  fitAll(true);
  setTimeout(() => {
    window.print();
    setTimeout(() => { document.title = oldTitle; }, 1500);
  }, 80);
}

window.addEventListener('resize',fitAll);
window.addEventListener('beforeprint',()=>fitAll(true));
window.addEventListener('afterprint',()=>fitAll(false));
</script>
</body>
